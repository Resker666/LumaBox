# Included within the active nginx http block, alongside other existing sites.
map "$request_method:$http_origin" $lumabox_request_allowed {
    default 0;
    ~^(GET|HEAD|OPTIONS): 1;
    "POST:https://lumabox.resker666.cloud" 1;
}

server {
    listen 80;
    server_name lumabox.resker666.cloud;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/ghost-chat-acme;
        try_files $uri =404;
    }
    location / {
        return 308 https://lumabox.resker666.cloud$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name lumabox.resker666.cloud;
    ssl_certificate /etc/letsencrypt/live/lumabox.resker666.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lumabox.resker666.cloud/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # The app must use --access-file and --secure-cookie before enabling HTTPS.
    client_max_body_size 8k;

    # Validate the browser's public Origin before translating to the private app.
    if ($lumabox_request_allowed = 0) { return 403; }

    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:8765;
        proxy_set_header Origin http://127.0.0.1:8765;
        proxy_set_header Authorization "";
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
