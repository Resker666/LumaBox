# Temporary personal acceptance testing through the server's public IP.
# Include in the active nginx http block. Remove when enabling domain HTTPS.
map "$request_method:$http_origin" $lumabox_ip_request_allowed {
    default 0;
    ~^(GET|HEAD|OPTIONS): 1;
    "POST:http://39.106.202.240" 1;
}

server {
    listen 80;
    server_name 39.106.202.240;
    auth_basic "LumaBox preview";
    auth_basic_user_file /etc/nginx/lumabox-preview.htpasswd;
    client_max_body_size 8k;

    if ($lumabox_ip_request_allowed = 0) { return 403; }

    location / {
        proxy_pass http://127.0.0.1:18765;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:18765;
        proxy_set_header Origin http://127.0.0.1:18765;
        proxy_set_header Authorization "";
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
