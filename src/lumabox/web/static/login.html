<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>进入光匣 · LumaBox</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/static/app.css">
  <link rel="stylesheet" href="/static/login.css">
  <script src="/static/login.js" defer></script>
</head>
<body class="login-page">
  <header class="site-header">
    <a class="brand" href="/" aria-label="LumaBox 光匣首页"><span class="brand-mark" aria-hidden="true"><i></i></span><span>LumaBox <small>光匣</small></span></a>
    <span class="login-header-note">你的小小收藏空间</span>
  </header>
  <main class="login-main">
    <section class="login-layout" aria-label="登录光匣">
      <div class="intro">
        <div class="eyebrow">A LITTLE BOX OF GOOD THINGS</div>
        <h1>喜欢的瞬间，<br>值得好好收藏<span>。</span></h1>
        <p>一段视频，一组照片。<br>把舍不得划走的美好，留在自己的光匣。</p>
        <div class="light-art" aria-hidden="true"><div class="art-ring"></div><div class="art-box"><span class="art-play">▶</span></div><div class="art-photo"><span></span></div><i class="spark spark-one">✧</i><i class="spark spark-two">✦</i></div>
        <div class="intro-foot"><span>视频与图集</span><i>·</i><span>有序收藏</span><i>·</i><span>随时回看</span></div>
      </div>
      <section class="login-card" aria-labelledby="login-heading">
        <div class="card-symbol" aria-hidden="true">✧</div>
        <div class="login-card-eyebrow">WELCOME HOME</div>
        <h2 id="login-heading">欢迎回到光匣</h2>
        <p class="muted">输入访问密码，打开你的收藏。</p>
        <form id="login-form">
          <label for="access-password">访问密码</label>
          <div class="password-field"><input id="access-password" name="password" type="password" autocomplete="current-password" placeholder="输入你的访问密码" maxlength="256" required aria-describedby="login-error"><button id="toggle-password" type="button" aria-label="显示密码" aria-pressed="false"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M2 12s3.5-6.5 10-6.5S22 12 22 12s-3.5 6.5-10 6.5S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
          <div class="login-options"><label class="remember-label"><input id="remember-login" type="checkbox" checked>记住登录 7 天</label><span>仅在自己的设备勾选</span></div>
          <p id="login-error" class="form-error" role="alert" hidden></p>
          <button id="login-button" class="primary-button" type="submit"><span class="login-button-text">进入光匣</span><span aria-hidden="true">↗</span></button>
        </form>
        <div class="login-note"><svg width="15" height="17" viewBox="0 0 18 20" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><path d="M9 1.5 16 4v5c0 4.5-7 9-7 9s-7-4.5-7-9V4L9 1.5Z"/><path d="m5.5 9 2.3 2.3 4.7-4.6"/></svg><span>你的收藏，只向你敞开。</span></div>
      </section>
    </section>
  </main>
  <footer class="site-footer"><span>LumaBox · 光匣</span><span>给每个值得留住的瞬间，一个位置。</span></footer>
</body>
</html>
