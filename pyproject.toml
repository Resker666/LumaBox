[build-system]
requires = ["setuptools>=65", "wheel>=0.43"]
build-backend = "setuptools.build_meta"

[project]
name = "lumabox"
version = "0.1.0"
description = "LumaBox · 光匣 — verified single-work browser downloads"
requires-python = ">=3.11"
dependencies = ["playwright==1.58.0"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]

[project.scripts]
lumabox = "lumabox.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
