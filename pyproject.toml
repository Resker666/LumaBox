[build-system]
requires = ["setuptools>=65", "wheel>=0.43"]
build-backend = "setuptools.build_meta"

[project]
name = "lumabox"
version = "0.4.3"
description = "LumaBox · 光匣 — verified single-work browser downloads"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["playwright==1.58.0"]

[project.optional-dependencies]
web = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "httpx>=0.27,<1"]

[project.scripts]
lumabox = "lumabox.cli:main"
lumabox-web = "lumabox.web.__main__:main"
lumabox-start = "lumabox.launch:main"

[tool.setuptools.package-data]
"lumabox.web" = ["static/*.html", "static/*.css", "static/*.js"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
